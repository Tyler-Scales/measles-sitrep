[project]
name = "measles-sitrep"
version = "0.1.0"
description = "A Claude agent that drafts weekly measles situation reports from CDC NNDSS data, with an eval set"
readme = "README.md"
authors = [
    { name = "Tyler Wallace", email = "tyler.wallace@scalestreet.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.8.0",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
]

[project.scripts]
sitrep = "measles_sitrep.cli:main"

[build-system]
requires = ["uv_build>=0.11.12,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "markdown>=3.11.3",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
